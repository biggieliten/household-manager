name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: file:./ci.db

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: api
      - run: npx prisma generate --config prisma7.config.ts
        working-directory: api
      - run: npx tsc --noEmit
        working-directory: api

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: api
      - run: npx prisma generate --config prisma7.config.ts
        working-directory: api
      - run: npm ci
        working-directory: app
      - run: npx expo lint
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app

  discord:
    name: discord
    needs: [api, app]
    # Runs after CI whatever the result, once per new or ready PR
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          API_RESULT: ${{ needs.api.result }}
          APP_RESULT: ${{ needs.app.result }}
        shell: bash
        run: |
          case "$AUTHOR" in
            VarxTheBaron) NAMES=("Danksken" "MacLovin" "08a" "Sossen") ;;
            ElisaSte) NAMES=("Alldente" "PastaQueen" "Ketchup") ;;
            therealdanmalmx) NAMES=("ThinkPad") ;;
            biggieliten) NAMES=("Örjan") ;;
            *) NAMES=("$AUTHOR") ;;
          esac
          AUTHOR="${NAMES[RANDOM % ${#NAMES[@]}]}"
          if [ "$API_RESULT" = "success" ] && [ "$APP_RESULT" = "success" ]; then
            STATUS="✅ CI passed"
          elif [ "$API_RESULT" = "cancelled" ] || [ "$APP_RESULT" = "cancelled" ]; then
            STATUS="⏹️ CI cancelled"
          else
            STATUS="❌ CI failed"
          fi
          jq -n --arg t "$TITLE" --arg u "$URL" --arg a "$AUTHOR" --arg s "$STATUS" \
            '{content: "@everyone New PR by \($a): **\($t)**\n\($s)\n\($u)",
              allowed_mentions: {parse: ["everyone"]}}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
